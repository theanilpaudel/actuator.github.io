- question: "Is the app free to use?"
  answer: "Yes! The core Spring Boot Actuator monitoring features are completely free to use. We also offer an affordable, optional Pro tier that unlocks advanced capabilities like historical metrics, live log streaming, and multi-profile management."

- question: "Which mobile operating systems are supported?"
  answer: "The app is optimized for iOS 16.0 or later (iPhone and iPad) and Android 10.0 or later. We take full advantage of native platform features, smooth animations, and full dark mode support."

- question: "Is my Spring Boot application credentials and connection safe?"
  answer: "Security is our top priority. Your endpoint configurations, API keys, and authentication tokens (Basic Auth, OAuth2, Bearer tokens) are stored securely on your local device. We never store or access your sensitive application data remotely."

- question: "Does the app require installing a custom plugin or dependency in Spring Boot?"
  answer: "No custom plugins or extra libraries are required. As long as your Spring Boot project exposes standard Spring Boot Actuator endpoints, the app connects and renders them seamlessly."

- question: "Can I connect to local development or internal network instances?"
  answer: "Yes! You can monitor local instances on your Wi-Fi network, staging environments via VPN, or public production endpoints with proper authentication configured."

- question: "How do I request support or suggest a new feature?"
  answer: "You can reach out directly via our email paudelanil@yahoo.com. We regularly update the app based on developer feedback and community feature requests."